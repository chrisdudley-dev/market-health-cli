plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}
android {
    namespace 'dev.chrisdudley.markethealth'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'dev.chrisdudley.markethealth'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-android'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets {
        androidTest.assets.srcDir '../../tests/fixtures/android'
    }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}
// Build-time copies only. The repository root remains the single source of truth.
def stageCore = tasks.register('stageCore', Sync) {
    from('../../market_health') {
        include '**/*.py'
        exclude 'calibration/**', 'dashboard_legacy.py', 'market_ui.py', 'mh_cli.py',
                'policy_cli.py', '__main__.py', 'refresh_snapshot.py'
        into 'market_health'
    }
    into layout.buildDirectory.dir('generated/python')
}
chaquopy {
    defaultConfig {
        version '3.11'
        def hostPython = providers.gradleProperty('mhPython').orElse(providers.environmentVariable('MH_BUILD_PYTHON')).orNull
        if (hostPython != null) { buildPython hostPython }
        pip { install 'numpy==1.26.2'; install 'pandas==2.1.3' }
    }
    sourceSets { main { srcDir layout.buildDirectory.dir('generated/python').get().asFile } }
}
tasks.matching { it.name.contains('Python') }.configureEach { dependsOn(stageCore) }
tasks.named('preBuild').configure { dependsOn(stageCore) }
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}

// Debug builds are explicitly limited to 4 KB devices. Do not publish a general
// release until all native dependencies pass the 16 KB audit and runtime parity.
def verify16kDependencies = tasks.register('verify16kDependencies', Exec) {
    dependsOn 'generateReleasePythonRequirements'
    def hostPython = providers.gradleProperty('mhPython').orElse(providers.environmentVariable('MH_BUILD_PYTHON')).getOrElse('python3.11')
    commandLine hostPython, '../tools/audit_native_pages.py', layout.buildDirectory.dir('python/pip/release').get().asFile.absolutePath
}
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach { dependsOn verify16kDependencies }
