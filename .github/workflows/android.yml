name: Android build and parity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: python -m pip install numpy==1.26.2 pandas==2.1.3 pytest rich PyYAML
      - run: python -m pytest tests/test_android_parity.py tests/test_mh_policy.py tests/test_desktop_store.py
      - name: Build app and instrumentation APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MarketHealth-android-debug-4k
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.*
      - name: Embedded runtime parity and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
