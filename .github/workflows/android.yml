name: Android release readiness
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.13
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: android/app/build/locked-wheels
          key: android-wheels-${{ hashFiles('android/requirements-lock.json') }}
      - name: Full regression with Android-pinned numerical versions
        run: |
          python3.11 -m venv .venv-android-host
          . .venv-android-host/bin/activate
          python -m pip install -e '.[dev]' numpy==1.26.2 pandas==2.1.3
          python -m pytest -o addopts='' -q
      - name: Build debug and unsigned release; audit actual APKs and AAB
        working-directory: android
        run: ./gradlew --no-daemon -PmhPython=python3.13 :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease :app:validateReleaseSigning :app:writeValidationSigningInfo
      - name: Prove that release builds reject a bad packaged ELF
        working-directory: android
        run: python3.13 tools/prove_release_gate.py
      - name: Build an APK from the actual AAB with a disposable debug signature
        run: python3.13 android/tools/build_validation_apk.py
      - name: Native wheel provenance
        run: python3.13 android/tools/audit_baseline_provenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarketHealth-release-readiness
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/app-release-test-signed.apk
            android/app/build/reports/native-pages/
            android/app/build/reports/lint-results-*
  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - page_size: 4096
            target: default
          - page_size: 16384
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: MarketHealth-release-readiness
          path: runtime-artifacts
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual debug and release Android runtime parity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: python3 android/tools/run_runtime_checks.py --artifacts runtime-artifacts --page-size ${{ matrix.page_size }} --report-dir runtime-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-${{ matrix.page_size }}
          path: runtime-reports/
